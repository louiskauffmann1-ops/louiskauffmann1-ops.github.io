<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<!-- PAGE -->
<title>NEXUS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@500;700;900&display=swap">
<style>
/* Console NEXUS. Un rail de modules (à gauche sur ordinateur, en bas sur téléphone) et une vue par
   module, chacune dans sa couleur : NEXUS cyan, HERMÈS bleu glacier, CHRONOS ambre, PLOUTOS vert,
   PHÉMÈ violet, ARÈS rouge. Le rouge d'alerte reste réservé à ce qui demande d'agir.
   Un seul univers visuel, sombre, voulu ainsi. */
:root {
  --fond: #03060a;
  --ligne: rgba(120, 200, 255, .16);
  --ligne-forte: rgba(120, 200, 255, .32);
  --texte: #dbeaf4;
  --doux: #7f98ab;
  --tres-doux: #4b6274;
  --alerte: #ff4d5e;
  --ambre: #ffb547;
  --nexus: #4fdcff;
  --hermes: #7cc8ff;
  --chronos: #ffb547;
  --ploutos: #4ff0a6;
  --pheme: #b48cff;
  --ares: #ff5a4f;
  --m: var(--nexus);
  --titre: "Orbitron", "Chakra Petch", "Segoe UI", sans-serif;
  --corps: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --rail: 84px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--texte);
  font: 500 15px/1.5 var(--corps); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 30;
  height: env(safe-area-inset-top, 0px); background: var(--fond);
}
button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--m); outline-offset: 2px; }

/* Ambiance : grille, halo de la couleur du module, lignes de balayage */
.ambiance { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.ambiance::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 45% at 55% 0%, color-mix(in srgb, var(--m) 16%, transparent), transparent 70%),
    radial-gradient(ellipse 50% 40% at 100% 100%, color-mix(in srgb, var(--m) 7%, transparent), transparent 70%),
    linear-gradient(rgba(120, 200, 255, .04) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgba(120, 200, 255, .04) 1px, transparent 1px) 0 0 / 40px 40px;
}
.ambiance::after {
  content: ""; position: absolute; inset: 0; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px);
}
.balayage {
  position: absolute; left: 0; right: 0; height: 120px; top: -120px;
  background: linear-gradient(transparent, color-mix(in srgb, var(--m) 6%, transparent), transparent);
  animation: balayer 9s linear infinite;
}
@keyframes balayer { to { transform: translateY(calc(100vh + 240px)); } }

/* Structure */
.appli { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; z-index: 20;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 18px 0 18px env(safe-area-inset-left, 0px);
  border-right: 1px solid var(--ligne); background: linear-gradient(180deg, rgba(5, 12, 20, .92), rgba(3, 6, 10, .92));
}
.rail .logo { width: 44px; height: 44px; margin-bottom: 10px; }
.onglet {
  --c: var(--nexus);
  width: 62px; display: grid; justify-items: center; gap: 5px; padding: 8px 0;
  background: none; border: 0; cursor: pointer; color: var(--doux);
}
.onglet .anneau {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; position: relative;
  border: 1px solid var(--ligne-forte); background: radial-gradient(circle, rgba(255, 255, 255, .03), transparent 70%);
  transition: border-color .25s, box-shadow .25s, background .25s;
}
.onglet .anneau::after {
  content: ""; position: absolute; inset: 3px; border-radius: 50%;
  border: 2px dashed transparent; transition: border-color .25s;
}
.onglet svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.onglet span.nom { font: 600 9px/1 var(--titre); letter-spacing: .12em; }
.onglet:hover { color: var(--c); }
.onglet[aria-current="page"] { color: var(--c); }
.onglet[aria-current="page"] .anneau {
  border-color: var(--c); background: radial-gradient(circle, color-mix(in srgb, var(--c) 22%, transparent), transparent 72%);
  box-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent);
}
.onglet[aria-current="page"] .anneau::after { border-color: color-mix(in srgb, var(--c) 55%, transparent); animation: tourner 12s linear infinite; }
.onglet.bientot { opacity: .45; }
.onglet .badge {
  position: absolute; top: -3px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--alerte); color: #fff; font: 600 10px/18px var(--mono); text-align: center;
}
@keyframes tourner { to { transform: rotate(360deg); } }

.contenu {
  min-width: 0;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}

/* Bandeau d'état */
.bandeau {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0 12px;
  background: linear-gradient(var(--fond) 75%, transparent);
}
.marque { font: 900 14px/1 var(--titre); letter-spacing: .38em; color: var(--nexus); }
.marque small { font: 500 10px/1 var(--mono); letter-spacing: .2em; color: var(--doux); margin-left: 8px; }
.puces-etat { display: flex; gap: 6px; flex-wrap: wrap; }
.puce-etat {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--ligne);
  font: 500 10px/1.2 var(--mono); letter-spacing: .08em; color: var(--doux); text-transform: uppercase;
}
.puce-etat i { width: 6px; height: 6px; border-radius: 50%; background: var(--ploutos); box-shadow: 0 0 6px var(--ploutos); }
.puce-etat.vieux i { background: var(--ambre); box-shadow: 0 0 6px var(--ambre); }
.commandes { margin-left: auto; display: flex; gap: 8px; }
.cmd {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; cursor: pointer;
  border: 1px solid var(--ligne-forte); background: rgba(8, 18, 28, .8);
  font: 600 11px/1 var(--titre); letter-spacing: .14em; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}
.cmd:hover { border-color: var(--m); color: var(--m); }
.cmd svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* En-tête de module */
.tete-module { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; padding: 10px 0 18px; border-bottom: 1px solid var(--ligne); margin-bottom: 20px; position: relative; }
.tete-module::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 140px; height: 2px; background: var(--m); box-shadow: 0 0 12px var(--m); }
.tete-module h1 { margin: 0; font: 900 clamp(28px, 5vw, 46px)/1 var(--titre); letter-spacing: .12em; color: var(--m); text-shadow: 0 0 24px color-mix(in srgb, var(--m) 45%, transparent); }
.tete-module .epithete { font: 500 12px/1.4 var(--mono); letter-spacing: .18em; color: var(--doux); text-transform: uppercase; padding-bottom: 4px; }
.tete-module .code { margin-left: auto; font: 400 11px/1.4 var(--mono); color: var(--tres-doux); text-align: right; padding-bottom: 4px; }

/* Panneaux */
.grille { display: grid; gap: 18px; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.pile { display: grid; gap: 18px; min-width: 0; }
.panneau {
  min-width: 0; position: relative; padding: 16px 18px 18px;
  background: linear-gradient(160deg, rgba(14, 30, 46, .55), rgba(6, 13, 21, .75));
  border: 1px solid var(--ligne);
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
}
.panneau::before {
  content: ""; position: absolute; top: 0; left: 0; width: 46px; height: 2px; background: var(--m); box-shadow: 0 0 10px var(--m);
}
.panneau::after {
  content: ""; position: absolute; right: 6px; bottom: 6px; width: 10px; height: 10px;
  border-right: 2px solid var(--m); border-bottom: 2px solid var(--m); opacity: .6;
}
.panneau.alerte { --m: var(--alerte); background: linear-gradient(160deg, rgba(60, 10, 16, .55), rgba(20, 6, 9, .8)); border-color: rgba(255, 77, 94, .35); }
.p-titre { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
.p-titre h2 { margin: 0; font: 700 12px/1.2 var(--titre); letter-spacing: .24em; color: var(--m); text-transform: uppercase; }
.p-titre .meta { margin-left: auto; font: 400 11px/1 var(--mono); color: var(--doux); white-space: nowrap; }
.p-titre .compte { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--texte); padding: 2px 6px; border: 1px solid var(--ligne-forte); }

/* Listes */
.liste { list-style: none; margin: 0; padding: 0; }
.liste > li + li { border-top: 1px solid var(--ligne); }
.rangee { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
a.rangee:hover .principal { color: var(--m); }
.principal { overflow-wrap: anywhere; line-height: 1.35; }
.secondaire { display: block; margin-top: 2px; font-size: 13px; color: var(--doux); overflow-wrap: anywhere; }
.temps { font: 400 11px/1.3 var(--mono); color: var(--doux); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.vide { padding: 10px 0; color: var(--doux); font-size: 14px; }
.losange { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--doux); }
.losange.plein { background: var(--m); border-color: var(--m); box-shadow: 0 0 8px var(--m); }
.etiquette {
  display: inline-block; margin: 4px 6px 0 0; padding: 1px 7px; font: 500 10px/1.6 var(--mono); letter-spacing: .06em;
  color: var(--m); background: color-mix(in srgb, var(--m) 12%, transparent); border: 1px solid color-mix(in srgb, var(--m) 30%, transparent);
}

/* Jauges */
.jauges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
.jauge { display: grid; justify-items: center; gap: 6px; text-align: center; }
.jauge svg { width: 100%; max-width: 128px; height: auto; overflow: visible; }
.jauge .lib { font: 600 10px/1.2 var(--titre); letter-spacing: .18em; color: var(--doux); text-transform: uppercase; }
.jauge text { font-family: var(--titre); fill: var(--texte); }

/* Accueil */
.accueil { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px) minmax(0, 1fr); gap: 22px; align-items: center; margin-bottom: 22px; }
.reacteur { position: relative; width: 100%; max-width: 380px; aspect-ratio: 1; margin: 0 auto; }
.reacteur canvas { width: 100%; height: 100%; display: block; }
.reacteur .centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.reacteur .h { font: 700 clamp(30px, 5vw, 44px)/1 var(--titre); letter-spacing: .04em; text-shadow: 0 0 18px color-mix(in srgb, var(--nexus) 60%, transparent); }
.reacteur .j { margin-top: 8px; font: 500 11px/1.3 var(--mono); letter-spacing: .2em; color: var(--nexus); text-transform: uppercase; }
.reacteur .s { margin-top: 4px; font: 400 10px/1 var(--mono); letter-spacing: .16em; color: var(--doux); }
.salut { margin: 0 0 4px; font: 700 clamp(22px, 3vw, 30px)/1.15 var(--titre); letter-spacing: .04em; text-wrap: balance; }
.transmission { font-size: 17px; line-height: 1.55; min-height: 3.1em; margin-top: 10px; }
.transmission .curseur { display: inline-block; width: .55em; height: 1em; vertical-align: -2px; background: var(--nexus); margin-left: 2px; animation: clignoter 1s steps(1) infinite; }
@keyframes clignoter { 50% { opacity: 0; } }
.source { font: 400 11px/1.4 var(--mono); letter-spacing: .08em; color: var(--doux); text-transform: uppercase; }
.priorites { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.priorites li { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 10px; }
.priorites b { font: 700 11px/1 var(--titre); color: var(--fond); background: var(--nexus); padding: 5px 0; text-align: center; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }

.compte-a-rebours { font: 700 30px/1 var(--titre); letter-spacing: .04em; color: var(--texte); font-variant-numeric: tabular-nums; }
.compte-a-rebours small { font: 500 12px/1 var(--mono); color: var(--doux); margin-left: 6px; letter-spacing: .1em; }

/* Bandeau d'actualité défilant */
.telescripteur { margin-top: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1px solid var(--ligne); background: rgba(6, 12, 20, .8); overflow: hidden; }
.telescripteur .tag { padding: 9px 14px; font: 700 11px/1 var(--titre); letter-spacing: .22em; color: var(--fond); background: var(--pheme); display: grid; place-items: center; }
.defile { overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.defile .piste { display: inline-flex; gap: 40px; padding: 9px 0; animation: defiler 90s linear infinite; }
.defile:hover .piste { animation-play-state: paused; }
.defile a { font-size: 14px; }
.defile a:hover { color: var(--pheme); }
.defile em { font: normal 500 10px/1 var(--mono); color: var(--pheme); margin-right: 8px; letter-spacing: .1em; text-transform: uppercase; }
@keyframes defiler { to { transform: translateX(-50%); } }

/* Barres d'échéance */
.echeance { display: grid; gap: 4px; min-width: 74px; }
.barre { height: 4px; background: rgba(255, 255, 255, .06); position: relative; }
.barre i { position: absolute; inset: 0 auto 0 0; background: var(--m); box-shadow: 0 0 6px var(--m); }
.barre.rouge i { background: var(--alerte); box-shadow: 0 0 6px var(--alerte); }
.barre.ambre i { background: var(--ambre); box-shadow: 0 0 6px var(--ambre); }
.case { width: 14px; height: 14px; border: 1.5px solid var(--m); position: relative; }
.case::after { content: ""; position: absolute; inset: 3px; background: color-mix(in srgb, var(--m) 30%, transparent); }

/* CHRONOS */
.horloge-24 svg { width: 100%; max-width: 420px; display: block; margin: 0 auto; overflow: visible; }
.horloge-24 text { font-family: var(--mono); font-size: 10px; fill: var(--doux); }
.semaine { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.jour { min-width: 0; border: 1px solid var(--ligne); background: rgba(6, 12, 20, .6); padding: 8px; min-height: 140px; display: grid; align-content: start; gap: 6px; }
.jour.aujourdhui { border-color: var(--m); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--m) 40%, transparent); }
.jour h4 { margin: 0 0 4px; font: 700 10px/1.3 var(--titre); letter-spacing: .14em; color: var(--doux); text-transform: uppercase; }
.jour.aujourdhui h4 { color: var(--m); }
.evt { font-size: 12px; line-height: 1.3; padding: 5px 6px; border-left: 2px solid var(--m); background: color-mix(in srgb, var(--m) 9%, transparent); overflow-wrap: anywhere; }
.evt b { display: block; font: 500 10px/1.2 var(--mono); color: var(--m); }
.horaire { font: 500 12px/1.3 var(--mono); color: var(--m); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 88px; }

/* PLOUTOS et modules à venir */
.etapes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: e; }
.etapes li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; counter-increment: e; }
.etapes li::before { content: counter(e, decimal-leading-zero); font: 700 11px/1.9 var(--mono); color: var(--m); border: 1px solid color-mix(in srgb, var(--m) 40%, transparent); text-align: center; }
.hors-ligne { position: relative; min-height: 180px; display: grid; place-items: center; text-align: center; overflow: hidden; }
.hors-ligne canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; }
.hors-ligne .msg { position: relative; display: grid; gap: 6px; padding: 14px 18px; background: rgba(3, 6, 10, .82); border: 1px solid color-mix(in srgb, var(--m) 40%, transparent); }
.hors-ligne .msg b { font: 700 12px/1.2 var(--titre); letter-spacing: .24em; color: var(--m); }
.hors-ligne .msg span { font-size: 13px; color: var(--doux); max-width: 34ch; }

/* PHÉMÈ */
.filtres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filtre { padding: 6px 12px; cursor: pointer; border: 1px solid var(--ligne-forte); background: transparent; font: 600 11px/1 var(--titre); letter-spacing: .12em; color: var(--doux); }
.filtre[aria-pressed="true"] { color: var(--fond); background: var(--m); border-color: var(--m); }
.une { display: grid; gap: 6px; padding: 4px 0 6px; }
.une .titre-une { font: 600 clamp(18px, 2.4vw, 24px)/1.25 var(--corps); text-wrap: balance; }
.une:hover .titre-une { color: var(--m); }
.une p { margin: 0; color: var(--doux); font-size: 14px; max-width: 70ch; }

/* Verrou et démarrage */
.verrou { position: relative; z-index: 2; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.verrou form { display: grid; gap: 14px; justify-items: center; width: min(360px, 100%); }
.verrou .reacteur { width: 180px; }
.verrou .marque { font-size: 24px; }
.verrou label { font-size: 14px; color: var(--doux); }
.verrou input { width: 100%; padding: 13px 14px; border: 1px solid var(--ligne-forte); background: rgba(8, 18, 28, .9); font-family: var(--mono); font-size: 16px; text-align: center; letter-spacing: .1em; }
.verrou input:focus { border-color: var(--nexus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--nexus) 18%, transparent); }
.verrou .cmd { width: 100%; justify-content: center; padding: 13px; background: var(--nexus); color: var(--fond); border-color: var(--nexus); }
.verrou .cmd:hover { color: var(--fond); filter: brightness(1.12); }
.message { min-height: 1.5em; font-size: 14px; color: var(--doux); }
.message.erreur { color: var(--alerte); }
.demarrage { position: fixed; inset: 0; z-index: 40; background: var(--fond); display: grid; place-items: center; transition: opacity .5s; }
.demarrage pre { margin: 0; font: 500 12px/1.9 var(--mono); color: var(--nexus); letter-spacing: .1em; min-width: min(360px, 90vw); }
.demarrage.fini { opacity: 0; pointer-events: none; }

.vue { animation: entrer .45s ease-out; }
@keyframes entrer { from { opacity: .3; transform: translateY(6px); } }

@media (max-width: 1100px) {
  .accueil { grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); }
  .accueil .col-jauges { grid-column: span 2; }
  .accueil .col-jauges .jauges { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .s3, .s4, .s5 { grid-column: span 6; } .s7, .s8 { grid-column: span 12; }
}
@media (max-width: 760px) {
  :root { --rail: 0px; }
  .appli { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; justify-content: space-around; gap: 0;
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
    border-right: 0; border-top: 1px solid var(--ligne);
  }
  .rail .logo { display: none; }
  .onglet { width: auto; padding: 2px 0; }
  .onglet .anneau { width: 38px; height: 38px; }
  .onglet svg { width: 18px; height: 18px; }
  .contenu { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .accueil { grid-template-columns: minmax(0, 1fr); }
  .accueil .col-reacteur { order: -1; }
  .accueil .col-jauges { grid-column: auto; }
  .reacteur { max-width: 260px; }

<body>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const FUSEAU = "Europe/Paris";
const DEMO = window.NEXUS_DEMO || null;
const CALME = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cle = null, donnees = null, briefingTape = false;

/* ---------- Clé gardée sur l'appareil (non exportable, dans IndexedDB) ---------- */
function base() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open("nexus", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("cles");
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
}
async function lireCle(sel) {
  try {
    const db = await base();
    return await new Promise((ok) => {
      const r = db.transaction("cles").objectStore("cles").get(sel);
      r.onsuccess = () => ok(r.result || null);
      r.onerror = () => ok(null);
    });
  } catch { return null; }
}
async function garderCle(sel, k) {
  try {
    const db = await base();
    const t = db.transaction("cles", "readwrite");
    t.objectStore("cles").clear();
    t.objectStore("cles").put(k, sel);
  } catch { /* pas de stockage : il faudra retaper le mot de passe */ }
}
async function oublierCle() {
  try { const db = await base(); db.transaction("cles", "readwrite").objectStore("cles").clear(); } catch {}
}

/* ---------- Déchiffrement (AES-256-GCM, clé PBKDF2-SHA256) ---------- */
const octets = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
async function deriver(motDePasse, paquet) {
  const brut = await crypto.subtle.importKey("raw", new TextEncoder().encode(motDePasse), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: octets(paquet.sel), iterations: paquet.iterations },
    brut, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function dechiffrer(paquet, k) {
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: octets(paquet.iv) }, k, octets(paquet.donnees));
  return JSON.parse(new TextDecoder().decode(clair));
}
async function telecharger() {
  const r = await fetch("donnees.json?" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("Données introuvables (" + r.status + ").");
  return r.json();
}

/* ---------- Outils ---------- */
const fmtHeure = new Intl.DateTimeFormat("fr-FR", { timeZone: FUSEAU, hour: "2-digit", minute: "2-digit" });
const fmtJour = new Intl.DateTimeFormat("fr-FR", { timeZone: FUSEAU, weekday: "short", day: "numeric", month: "short" });
const fmtJourLong = new Intl.DateTimeFormat("fr-FR", { timeZone: FUSEAU, weekday: "long", day: "numeric", month: "long" });
const jourParis = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: FUSEAU }).format(d);
function heureParis(d) {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: FUSEAU, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d);
  const v = (t) => Number(p.find((x) => x.type === t).value);
  return v("hour") + v("minute") / 60;
}
function joursEntre(isoJour) {
  const a = new Date(jourParis(new Date()) + "T00:00:00Z"), b = new Date(isoJour + "T00:00:00Z");
  return Math.round((b - a) / 864e5);
}
function quand(iso) {
  if (!iso) return "";
  const d = new Date(iso), maintenant = new Date();
  if (jourParis(d) === jourParis(maintenant)) return fmtHeure.format(d);
  if (jourParis(d) === jourParis(new Date(maintenant - 864e5))) return "hier " + fmtHeure.format(d);
  return fmtJour.format(d);
}
function ilYa(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (min < 60) return "il y a " + Math.max(min, 1) + " min";
  if (min < 24 * 60) return "il y a " + Math.round(min / 60) + " h";
  return fmtJour.format(new Date(iso));
}
function el(tag, attrs, ...enfants) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of enfants.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...enfants) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  for (const c of enfants.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function point(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function arc(cx, cy, r, d0, d1) {
  const [x0, y0] = point(cx, cy, r, d0), [x1, y1] = point(cx, cy, r, d1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${d1 - d0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
const couleur = (nom) => getComputedStyle(document.documentElement).getPropertyValue("--" + nom).trim();
const lien = (href, attrs, ...enfants) => el("a", { href, target: "_blank", rel: "noopener", ...attrs }, ...enfants);
function panneau(titre, meta, classe, ...corps) {
  return el("section", { class: "panneau " + (classe || "") }, el("div", { class: "p-titre" }, el("h2", null, titre), meta), ...corps);
}
function liste(elements, vide, construire) {
  if (!elements || !elements.length) return el("div", { class: "vide" }, vide);
  return el("ul", { class: "liste" }, elements.map((x) => el("li", null, construire(x))));
}

/* Jauge circulaire : 60 graduations, arc de progression, valeur au centre. */
function jauge({ valeur, max, texte, unite, lib, teinte }) {
  const ratio = Math.max(0, Math.min(1, max ? valeur / max : 0));
  const c = teinte || "var(--m)";
  const g = s("svg", { viewBox: "0 0 120 120", role: "img", "aria-label": `${lib} : ${texte ?? valeur} ${unite || ""}` });
  for (let i = 0; i < 60; i++) {
    const [x0, y0] = point(60, 60, 56, i * 6), [x1, y1] = point(60, 60, i % 5 ? 52 : 49, i * 6);
    g.append(s("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: i / 60 < ratio ? c : "rgba(127,152,171,.28)", "stroke-width": i % 5 ? 1 : 1.6 }));
  }
  g.append(s("circle", { cx: 60, cy: 60, r: 43, fill: "none", stroke: "rgba(127,152,171,.14)", "stroke-width": 4 }));
  if (ratio > 0) g.append(s("path", { d: arc(60, 60, 43, 0, Math.max(ratio * 359.9, 2)), fill: "none", stroke: c, "stroke-width": 4, style: "filter:drop-shadow(0 0 4px " + c + ")" }));
  g.append(s("text", { x: 60, y: 63, "text-anchor": "middle", "font-size": 22, "font-weight": 700 }, String(texte ?? valeur)));
  if (unite) g.append(s("text", { x: 60, y: 80, "text-anchor": "middle", "font-size": 7, "letter-spacing": 1.2, style: "fill:var(--doux)" }, unite));
  return el("div", { class: "jauge" }, g, el("div", { class: "lib" }, lib));
}

/* ---------- Réacteur (canvas), dans la couleur du module en cours ---------- */
const reacteurs = new Set();
function reacteur(canvas, options = {}) { reacteurs.add({ canvas, ctx: canvas.getContext("2d"), options }); }
function dessinerReacteur({ canvas, ctx, options }, t) {
  if (!canvas.isConnected) return false;
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (!r.width) return true;
  if (canvas.width !== Math.round(r.width * dpr)) { canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.width * dpr); }
  const w = canvas.width, c = w / 2, teinte = options.teinte || couleur("nexus");
  const rot = (v) => (CALME ? 0 : t * v);
  ctx.clearRect(0, 0, w, w);
  ctx.strokeStyle = teinte; ctx.lineCap = "butt";
  ctx.globalAlpha = .45; ctx.lineWidth = Math.max(1, w * .003);
  for (let i = 0; i < 120; i++) {

    ctx.beginPath(); ctx.moveTo(c + Math.cos(a) * w * .49, c + Math.sin(a) * w * .49);
    ctx.lineTo(c + Math.cos(a) * w * (.49 - long), c + Math.sin(a) * w * (.49 - long)); ctx.stroke();
  }
  const anneaux = [
    [0.42, 0.00022, 0.014, 3, 0.75, 0.7], [0.38, -0.0004, 0.006, 40, 0.4, 0.5],
    [0.34, 0.0006, 0.026, 6, 0.95, 0.55], [0.285, -0.00025, 0.004, 90, 0.5, 0.45], [0.25, 0.0009, 0.01, 2, 0.8, 0.35],
  ];
  for (const [rayon, vitesse, ep, segments, alpha, remplissage] of anneaux) {
    ctx.globalAlpha = alpha; ctx.lineWidth = w * ep;
    const pas = (Math.PI * 2) / segments, angle = rot(vitesse);
    for (let i = 0; i < segments; i++) {
      ctx.beginPath(); ctx.arc(c, c, w * rayon, angle + i * pas, angle + i * pas + pas * remplissage); ctx.stroke();
    }

    ctx.globalAlpha = 1; ctx.lineWidth = w * .008; ctx.shadowBlur = w * .03; ctx.shadowColor = teinte;
    ctx.beginPath(); ctx.arc(c, c, w * .455, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * options.progression()); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  const pouls = CALME ? 1 : 0.85 + 0.15 * Math.sin(t / 700);
  const g = ctx.createRadialGradient(c, c, 0, c, c, w * .24);
  g.addColorStop(0, "rgba(255,255,255,.22)"); g.addColorStop(.25, teinte + "55"); g.addColorStop(1, "transparent");
  ctx.globalAlpha = pouls; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c, c, w * .24, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  return true;
}
function boucle(t) {
  for (const e of reacteurs) if (!dessinerReacteur(e, t)) reacteurs.delete(e);
  if (!CALME) requestAnimationFrame(boucle);
}

/* Ondes en fond pour les modules sans données */
function brouillage(canvas) {
  const ctx = canvas.getContext("2d");
  const r = canvas.getBoundingClientRect(), w = canvas.width = r.width, h = canvas.height = r.height;
  ctx.strokeStyle = couleur(courant); ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    ctx.globalAlpha = .25 + i * .1; ctx.beginPath();
    for (let x = 0; x <= w; x += 8) {
      const y = h * (.25 + i * .1) + Math.sin(x / (30 + i * 9) + i) * 14 + Math.sin(x / 11 + i * 3) * 4;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
}

/* ---------- Modules ---------- */
// Ajouter un module = une entrée ici, une couleur dans :root et une fonction de rendu.
const ICONES = {
  nexus: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  hermes: '<path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/>',
  chronos: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ploutos: '<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
  pheme: '<path d="M4 5h13v14H4z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 13h7M7 16h4"/>',
  ares: '<path d="M6 8v8M18 8v8M3 10.5v3M21 10.5v3M6 12h12"/>',
};
const MODULES = [
  { id: "nexus", nom: "NEXUS", epithete: "chef d'orchestre", rendu: vueNexus },
  { id: "hermes", nom: "HERMÈS", epithete: "messager · mails et tâches", rendu: vueHermes },
  { id: "chronos", nom: "CHRONOS", epithete: "maître du temps · agenda", rendu: vueChronos },
  { id: "ploutos", nom: "PLOUTOS", epithete: "gardien des richesses · budget", rendu: vuePloutos },
  { id: "pheme", nom: "PHÉMÈ", epithete: "voix du monde · actualité", rendu: vuePheme },
  { id: "ares", nom: "ARÈS", epithete: "force · entraînement", rendu: vueAres },
];
let courant = "nexus";

function construireRail() {
  const rail = $("rail");
  rail.querySelectorAll(".onglet").forEach((o) => o.remove());
  for (const m of MODULES) {
    const anneau = el("span", { class: "anneau" });
    anneau.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[m.id]}</svg>`;
    const badge = m.id === "hermes" ? donnees.hermes.taches.filter((t) => t.retard).length : 0;
    if (badge) anneau.append(el("span", { class: "badge", title: badge + " tâche(s) en retard" }, String(badge)));
    rail.append(el("button", {
      class: "onglet" + (m.id === "ares" && !(donnees.ares && !donnees.ares.erreur) ? " bientot" : ""), type: "button", style: `--c:var(--${m.id})`,
      "aria-current": m.id === courant ? "page" : null, title: m.nom,
      onclick: () => aller(m.id),
    }, anneau, el("span", { class: "nom" }, m.nom)));
  }
}
function aller(id, depuisAdresse) {
  if (!MODULES.some((m) => m.id === id)) id = "nexus";
  courant = id;
  document.documentElement.style.setProperty("--m", `var(--${id})`);
  if (!depuisAdresse) { try { history.replaceState(null, "", "#" + id); } catch {} }
  rendre();
  scrollTo({ top: 0 });
}
function rendre() {
  if (!donnees) return;
  construireRail();
  etat();
  const m = MODULES.find((x) => x.id === courant);
  const vue = el("div", { class: "vue" });
  if (m.id !== "nexus") vue.append(el("div", { class: "tete-module" },
    el("h1", null, m.nom), el("span", { class: "epithete" }, m.epithete),
    el("span", { class: "code" }, "MODULE " + String(MODULES.indexOf(m)).padStart(2, "0") + " / " + String(MODULES.length - 1).padStart(2, "0"), el("br"), "SYNCHRO " + quand(donnees.maj))));
  vue.append(m.rendu(donnees));
  $("vue").replaceChildren(vue);
  vue.querySelectorAll("canvas[data-brouillage]").forEach(brouillage);
}
function etat() {
  const age = (Date.now() - new Date(donnees.maj)) / 36e5;
  const puces = [
    el("span", { class: "puce-etat" + (age > 4 ? " vieux" : ""), title: age > 4 ? "Données de plus de 4 heures" : "Données à jour" }, el("i"), "SYNCHRO " + quand(donnees.maj)),
    ...["hermes", "chronos", "pheme"].map((id) => el("span", { class: "puce-etat optionnel" }, el("i"), MODULES.find((m) => m.id === id).nom)),
  ];
  if (DEMO) puces.unshift(el("span", { class: "puce-etat", style: "color:var(--ambre);border-color:var(--ambre)" }, "DÉMO · DONNÉES FICTIVES"));
  $("puces-etat").replaceChildren(...puces);
}

/* --- NEXUS : la vue d'ensemble --- */
function prochainEvenement(d) {
  return [...d.chronos.aujourdhui, ...d.chronos.bientot].filter((e) => !e.journee_entiere && e.debut)
    .map((e) => ({ ...e, t: new Date(e.debut) })).filter((e) => e.t > new Date()).sort((a, b) => a.t - b.t)[0];
}
function rebours(cible) {
  const min = Math.max(0, Math.round((cible - new Date()) / 6e4));
  if (min < 60) return [String(min), "MIN"];
  if (min < 48 * 60) return [Math.floor(min / 60) + "h" + String(min % 60).padStart(2, "0"), ""];
  return [String(Math.round(min / 1440)), "JOURS"];
}
function salutation() {
  const h = heureParis(new Date());
  return h < 5 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir";
}
function vueNexus(d) {
  const b = d.briefing;
  const duJour = b && b.date === jourParis(new Date());
  const h = d.hermes, c = d.chronos;
  const retards = h.taches.filter((t) => t.retard).length;
  const jBudget = joursEntre(d.ploutos.point_budget_date);

  const texte = el("div", { class: "transmission" });
  taper(texte, b ? b.en_bref : "Le premier briefing arrivera demain matin.");
  const gauche = el("div", { class: "col-texte" },
    el("h1", { class: "salut" }, salutation() + ", " + d.prenom + "."),
    el("div", { class: "source" }, duJour ? "Transmission · briefing de ce matin" : b ? "Dernier briefing · " + b.titre : "Aucun briefing reçu"),
    texte,
    el("ol", { class: "priorites" }, (duJour ? b.priorites : []).slice(0, 3).map((p, i) => el("li", null, el("b", null, "P" + (i + 1)), el("span", null, p)))));

  const canvas = el("canvas", { "aria-hidden": "true" });
  reacteur(canvas, { progression: () => heureParis(new Date()) / 24 });
  const centre = el("div", { class: "reacteur" }, canvas,
    el("div", { class: "centre" }, el("div", { class: "h", id: "horloge" }, fmtHeure.format(new Date())),
      el("div", { class: "j" }, fmtJourLong.format(new Date())), el("div", { class: "s" }, "PARIS · " + Math.round(heureParis(new Date()) / 24 * 100) + " % DU JOUR")));

  const jauges = el("div", { class: "col-jauges" }, el("div", { class: "jauges" },
    jauge({ valeur: h.taches.length, max: 10, lib: "Tâches", unite: retards ? retards + " EN RETARD" : "OUVERTES", teinte: retards ? "var(--alerte)" : "var(--hermes)" }),
    jauge({ valeur: h.non_lus, max: 30, lib: "Non lus", unite: "BOÎTE", teinte: "var(--hermes)" }),
    jauge({ valeur: c.heures_occupees, max: 12, texte: String(c.heures_occupees).replace(".", ","), lib: "Charge", unite: "HEURES", teinte: "var(--chronos)" }),
    jauge({ valeur: 31 - Math.min(jBudget, 31), max: 31, texte: jBudget ? "J-" + jBudget : "J", lib: "Budget", unite: "LE 5", teinte: "var(--ploutos)" })));

  const alertes = [...(c.conflits || []).map((x) => "Conflit d'agenda : " + x), ...(duJour ? b.attention : [])].slice(0, 5);
  const prochain = prochainEvenement(d);
  const [n, u] = prochain ? rebours(prochain.t) : ["", ""];
  const fil = articles(d);

  const grille = el("div", { class: "grille" },
    alertes.length ? el("div", { class: "s12" }, panneau("Attention", el("span", { class: "meta" }, alertes.length + " SIGNAL" + (alertes.length > 1 ? "S" : "")), "alerte",
      liste(alertes, "", (a) => el("div", { class: "rangee" }, el("span", { class: "losange plein" }), el("span", { class: "principal" }, a), el("span"))))) : null,
    el("div", { class: "s4", style: "--m:var(--chronos)" },
      panneau("Prochain événement", el("span", { class: "meta" }, "CHRONOS"), "",
        prochain ? el("div", null, el("div", { class: "compte-a-rebours" }, n, el("small", null, u)),
          el("div", { class: "principal", style: "margin-top:10px" }, prochain.titre),
          el("span", { class: "secondaire" }, prochain.jour + " · " + prochain.horaire + (prochain.lieu ? " · " + prochain.lieu : "")))
          : el("div", { class: "vide" }, "Rien de prévu dans les 7 jours."),
        lienModule("chronos", "Agenda"))),

  for (const l of lignes) { pre.textContent += l + "\n"; await new Promise((r) => setTimeout(r, 140)); }
  await new Promise((r) => setTimeout(r, 250));
  ecran.classList.add("fini");
  setTimeout(() => { ecran.hidden = true; }, 500);
}
async function ouvrir(d) {
  donnees = d;
  $("verrou").hidden = true;
  $("appli").hidden = false;
  aller((location.hash || "#nexus").slice(1), true);
  await sequenceDemarrage();
}
async function demarrer() {
  setInterval(horloge, 10000);
  reacteur($("reacteur-verrou"));
  requestAnimationFrame(boucle);
  if (DEMO) { $("verrouiller").hidden = true; return ouvrir(DEMO); }
  let paquet;
  try { paquet = await telecharger(); }
  catch { return montrerVerrou("Impossible de charger les données. Vérifie ta connexion puis recharge la page."); }
  cle = await lireCle(paquet.sel);
  if (cle) {
    try { return await ouvrir(await dechiffrer(paquet, cle)); } catch { cle = null; await oublierCle(); }
  }
  montrerVerrou("");
  $("formulaire").onsubmit = async (ev) => {
    ev.preventDefault();
    message("Vérification…", false);
    try {
      const k = await deriver($("mdp").value, paquet);
      const d = await dechiffrer(paquet, k);
      cle = k; await garderCle(paquet.sel, k); $("mdp").value = "";
      ouvrir(d);
    } catch { message("Mot de passe incorrect.", true); }
  };
}
function message(t, erreur) { $("message-verrou").textContent = t; $("message-verrou").classList.toggle("erreur", erreur); }
function montrerVerrou(t) { $("appli").hidden = true; $("verrou").hidden = false; message(t, !!t); $("mdp").focus(); }

$("rafraichir").onclick = async () => {
  if (DEMO) return rendre();
  try { donnees = await dechiffrer(await telecharger(), cle); rendre(); } catch { location.reload(); }
};
$("verrouiller").onclick = async () => { await oublierCle(); location.reload(); };
addEventListener("hashchange", () => aller(location.hash.slice(1), true));
document.addEventListener("visibilitychange", () => { if (!document.hidden && cle) $("rafraichir").click(); });
if (!DEMO && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
demarrer();
</script>
